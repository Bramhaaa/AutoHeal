spring:
  application:
    name: autoheal-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/autoheal}
    username: ${DATABASE_USER:autoheal}
    password: ${DATABASE_PASSWORD:autoheal}
  flyway:
    enabled: true
    locations: classpath:db/migration

autoheal:
  llm:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      prompt-price-per-million: ${GEMINI_PROMPT_PRICE_PER_MILLION:0.15}
      completion-price-per-million: ${GEMINI_COMPLETION_PRICE_PER_MILLION:0.60}
  github:
    token: ${GITHUB_TOKEN:}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
  pipeline:
    max-concurrent-runs: ${AUTOHEAL_MAX_CONCURRENT_RUNS:3}
    max-queued-runs: ${AUTOHEAL_MAX_QUEUED_RUNS:10}
    replay-event-delay-ms: ${AUTOHEAL_REPLAY_DELAY_MS:150}
    demo-repo-uri: ${DEMO_REPO_URI:}
    demo-repo-name: ${DEMO_REPO_NAME:autoheal-demo-service}
    pr-creation-enabled: ${AUTOHEAL_PR_CREATION_ENABLED:false}
