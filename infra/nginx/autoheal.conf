server {
    listen 80;
    server_name _;

    # Overwrite any client-supplied X-Forwarded-For so rate limiting sees the real peer IP.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Dedicated SSE stream route: disable buffering and allow long-lived connections (PRD §4.2).
    location ~ ^/api/v1/incidents/[^/]+/stream$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }
}
