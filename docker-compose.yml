services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: autoheal-postgres
    environment:
      POSTGRES_DB: autoheal
      POSTGRES_USER: ${DATABASE_USER:-autoheal}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-${POSTGRES_PASSWORD:-autoheal}}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - autoheal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoheal -d autoheal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autoheal-pgdata:
